; Lines starting ; (semicolons) are commented out.
; That is, they do not affect the code and are here for demonstration purposes only.
; ----------------------------------

[Rainmeter]
Update=1000
Background=#@#Background.png
BackgroundMode=3
BackgroundMargins=0,35,5,10

[Metadata]
Author=pein (Kucharskov mod)
Description=OpenWeather widget
License=Creative Commons BY-NC-SA 3.0
Version=1.0.0

[Variables]
fontName=Roboto
textSize=8
colorBar=7,101,238,205
colorText=255,255,255,205

latitude=50.286263
longitude=19.104078
language=pl
appid=636b09e672791faadaea7d58c117d1d4

; ----------------------------------
; MEASURES return some kind of value
; ----------------------------------

[measureWeatherData]
Measure=Plugin
Plugin=WebParser
UpdateRate=1800
Url=https://api.openweathermap.org/data/2.5/weather?lat=#latitude#&lon=#longitude#&lang=#language#&units=metric&appid=#appid#
RegExp="(?siU).*\"description\":\"(.*)\",\"icon\".*\"temp\":(.*),\"feels_like\":(.*),\"temp_min\".*\"pressure\":(.*),\"humidity\".*"
StringIndex=1

[measureWeatherStatus]
Measure=Plugin
Plugin=WebParser
Url=[measureWeatherData]
StringIndex=1
Substitute="":"N/A"

[measureWeatherTemperature]
Measure=Plugin
Plugin=WebParser
Url=[measureWeatherData]
StringIndex=2

[measureWeatherFeelsLike]
Measure=Plugin
Plugin=WebParser
Url=[measureWeatherData]
StringIndex=3

[measureWeatherPressure]
Measure=Plugin
Plugin=WebParser
Url=[measureWeatherData]
StringIndex=4
Substitute="":"N/A"

[measureZero]
Measure=Calc
Formula=0

; ----------------------------------
; STYLES are used to "centralize" options
; ----------------------------------

[styleTitle]
StringAlign=CENTER
StringCase=UPPER
StringStyle=NORMAL
StringEffect=SHADOW
FontEffectColor=0,0,0,50
FontColor=#colorText#
FontFace=#fontName#
FontSize=10
AntiAlias=1
ClipString=1

[styleLeftText]
StringAlign=LEFT
StringCase=NONE
StringStyle=NORMAL
StringEffect=SHADOW
FontEffectColor=0,0,0,20
FontColor=#colorText#
FontFace=#fontName#
FontSize=#textSize#
AntiAlias=1
ClipString=1

[styleRightText]
StringAlign=RIGHT
StringCase=NONE
StringStyle=NORMAL
StringEffect=SHADOW
FontEffectColor=0,0,0,20
FontColor=#colorText#
FontFace=#fontName#
FontSize=#textSize#
AntiAlias=1
ClipString=1

[styleBar]
BarColor=#colorBar#
BarOrientation=HORIZONTAL
SolidColor=255,255,255,15

; ----------------------------------
; METERS display images, text, bars, etc.
; ----------------------------------

[meterTitle]
Meter=STRING
MeterStyle=styleTitle
X=100
Y=7
W=190
H=18
Text="Pogoda"

[meterLabelStatus]
Meter=STRING
MeterStyle=styleLeftText
X=5
Y=38
W=190
H=14
Text="Status"

[meterValueStatus]
Meter=STRING
StringCase=UPPER
MeterStyle=styleRightText
MeasureName=measureWeatherStatus
X=192
Y=0r
; To not overlap "Status"
W=145
H=14
Text=%1
DynamicVariables=1
ClipString=2

[meterBarStatus]
Meter=BAR
MeterStyle=styleBar
MeasureName=measureZero
X=5
Y=52
W=190
H=1

[meterLabelTemperature]
Meter=STRING
MeterStyle=styleLeftText
X=5
Y=60
W=190
H=14
Text="Temperatura"

[meterValueTemperature]
Meter=STRING
MeterStyle=styleRightText
MeasureName=measureZero
X=192
Y=0r
W=190
H=14
Text=[measureWeatherTemperature:0]°
DynamicVariables=1

[meterBarTemperature]
Meter=BAR
MeterStyle=styleBar
